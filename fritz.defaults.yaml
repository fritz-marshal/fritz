skyportal:
  app:
    title: Fritz
    # Opening sentences of a source's acknowledgment block, before the per-source
    # facilities/filters/programs. Overrides SkyPortal's default to also credit
    # BOOM/Babamul (Fritz's broker infrastructure) and its funding.
    acknowledgment: >-
      This work made use of the Fritz version of SkyPortal (van der Walt et al.
      2019, Coughlin et al. 2023), jointly developed at Caltech, UC Berkeley, the
      University of Minnesota, and Université Paris-Saclay. The Babamul alerts
      broker and BOOM software infrastructure (du Laz et al. 2026) is co-developed
      by the California Institute of Technology and the University of Minnesota.
      This work acknowledges support from the National Science Foundation through
      AST Award No. 2432476 (PI Kasliwal; co-PI Coughlin) and leverages experience
      from the Zwicky Transient Facility (co-PIs Graham and Kasliwal).

    # Copy for the About page, rendered by SkyPortal's AboutPlugins template.
    about:
      description: >-
        Fritz is an open source codebase that serves as a dynamic collaborative
        platform for time-domain astronomy. It is being jointly developed at
        Caltech, UC Berkeley, the University of Minnesota, and Université
        Paris-Saclay.
      homepage_url: https://fritz.science
      docs_url: https://docs.fritz.science/
      api_docs_url: https://docs.fritz.science/api.html
      repository_url: https://github.com/fritz-marshal/fritz
      funding: >-
        Fritz development is funded by the Moore Foundation, Heising Simons
        Foundation, National Science Foundation, NASA and the Packard
        Foundation.
      extra_paragraphs:
        - text: >-
            Fritz integrates and extends two projects, {BOOM} & {SkyPortal},
            and has the functionality of an alert broker, a multi-survey data
            sink/archive, a marshal, and a target and observation/follow-up
            management tool.
          links:
            BOOM: https://github.com/boom-astro/boom
            SkyPortal: https://skyportal.io

    # Observation plans solved as a MILP instead of greedily. Runs as a
    # subprocess, so a solve that hangs stays out of the app process.
    m4opt:
      enabled: true
      missions:
        ZTF: ztf

    assistant:
      # Building a filter takes more lookups than a question about one source:
      # reading the alert schema alone ran to seven calls, which left none for
      # the preview the answer is supposed to be measured against.
      max_tool_calls: 20
      # The model is slower on a turn that calls tools than on one that does
      # not, and a cut-off answer reaches the user as "something went wrong".
      # request_timeout is already 300, so this stops the overall deadline
      # ending a turn the model would have finished.
      answer_timeout: 300
      # Triage each analysis as it completes, against the shared queries
      # saved on the Assistant Queries page. The model and its credentials
      # come from the deployed config.
      analysis_triage:
        enabled: true

    # Accepted once per version; bump the version to ask everyone again.
    terms_of_service:
      enabled: true
      version: "2026-09-08"
      title: Fritz Terms of Service
      text_file: data/fritz_terms_of_service.md
      # A token cannot be shown the dialog; its owner still accepts at next login.
      exempt_tokens: true

    # Bounded so the pool cannot exhaust the database connections.
    thread_pool_size: 8

    tns:
      look_back_days: 7

    hermes:
      topic: hermes.test # Kafka topic used to publish outgoing SkyPortal alerts to Hermes

    observation_plan:
      # Plan groups scheduled at once. At 1 a slow scheduler holds up every
      # request behind it: twelve plans submitted together during GRB 260910B
      # took 46 minutes, nearly all of it waiting. Each worker costs a
      # scheduler process, so this tracks spare cores, not queue depth.
      max_concurrent: 3

  database:
    host: db
    password: password

    # Transaction-mode connection pooler (bundled pgbouncer, runs in the web
    # container). host/port here are where the app reaches pgbouncer; the
    # database.host/port above stay pointed at the real Postgres backend.
    pooler:
      enabled: true
      # IPv4 explicitly: pgbouncer listens on 127.0.0.1, and localhost can
      # resolve to ::1 (IPv6), where it isn't listening.
      host: 127.0.0.1
      # Sized for production concurrency; Cloud SQL max_connections is 600.
      default_pool_size: 100

  server:
    host: <host>
    port:
    # nginx parameter which sets both the time in seconds before which
    # the server is considered unavailable and the subsequent period of
    # time the server will be unavailable
    fail_timeout: 60

    # In addition to the local network, specify any IP addresses that are to be
    # exempt from API rate limiting
    whitelisted_ips:
      # Class A private network
      - 10.0.0.0/8
      # Class B private network
      - 172.16.0.0/12
      # Class C private network
      - 192.168.0.0/16
      # skipper.caltech.edu
      - 131.215.198.228

    # Specify IPs or address ranges (e.g., 130.211.0.0/22) that are associated
    # with upstream load balancing.
    # These trusted addresses are used to uncover the originating IP.
    loadbalancer_ips:
      # Google Load Balancer IPs
      # See https://cloud.google.com/load-balancing/docs/https#x-forwarded-for_header
      - 130.211.0.0/22
      - 35.191.0.0/16
      # preview.fritz.science
      - 34.120.0.80
      # fritz.science
      - 35.244.192.22

    auth:
      debug_login: True

      # Sign-in providers, in the order offered. This list is now the only
      # source of providers, so Google is named here too; keys come from the
      # deployment config.
      backends:
        - name: google-oauth2
          class: social_core.backends.google.GoogleOAuth2
          key:
          secret:
        - name: orcid
          class: social_core.backends.orcid.ORCIDOAuth2
          key:
          secret:
          label: Sign in with ORCID
          # ORCID verifies the addresses it publishes
          trust_email: true
        - name: github
          # Reports GitHub's own `verified` flag per address, which the stock
          # backend drops; no trust_email, so an unverified address cannot
          # attach to an existing account.
          class: baselayer.app.backends.github.VerifiedEmailGithubOAuth2
          key:
          secret:
          label: Sign in with GitHub

  services:
    disabled:
      - dask
    external:
      # The BOOM alert ingestion is now handled natively by SkyPortal's generic
      # broker_ingest service (driven by the BOOM Broker record's kafka altdata),
      # so the old boom-skyportal-plugin listener has been retired.
      # Turns incoming GCN circulars into structured data and attaches it to
      # the GcnEvent it belongs to. Writes through SkyPortal's own models, so it
      # needs no API token. Off until writes.live and consumer.enabled are set.
      circex:
        repo: https://github.com/skyportal/circex-skyportal-plugin.git
        rev: main
        params:
          skyportal:
            # Writes are attributed to this user.
            user_id: 1
            group_ids: []
            # SkyPortal requires an instrument_id on every photometry point.
            default_instrument_id: null
            instrument_map: {}
          writes:
            live: false
            alias: true
            source: true
            confirm_in_gcn: true
            comment: true
          resolver:
            # trigger_id matches an id in the circular text against
            # GcnEvent.trigger_id, which is stronger than any date arithmetic.
            order: [alias, trigger_id, designation, trigger]
            window_hours: 12
            localization_cumprob: 0.95
            retry_interval_seconds: 900
            retry_max_age_hours: 72
          extractor:
            kind: hybrid
            # Set per deployment; the real values live in the sops secret.
            llama_url:
            # llama_require_fields is model-specific and must match llama_model:
            #   Mistral-7B  false, or it pads photometry with invented rows
            #   Qwen3-27B   true, or it returns {} for every circular
            llama_model:
            llama_timeout: 300
            llama_require_fields: false
            llama_api_key:
            sn_type_model: null
            cache_path: /tmp/circex_llm_cache.sqlite
          consumer:
            enabled: false
            topic: gcn.circulars
            server: gcn.nasa.gov
            # Unset falls back to gcn.client_id / gcn.client_secret above.
            client_id:
            client_secret:
            # Stable across restarts, distinct from any other consumer.
            group_id: fritz-circex
            offset_reset: latest
            replay_dir: null
          archive:
            dir: null
      osg:
        repo: https://github.com/skyportal/osg-skyportal-plugin.git
        rev: main
        params:
          listener:
            host: 0.0.0.0
            port: 7100
          htcondor:
            collector: "cm-2.ospool.osg-htc.org, cm-1.ospool.osg-htc.org"
            schedd: ap41.uw.osg-htc.org
            scitoken_path: /secrets/scitokens/osg.use
            project_name: CHANGEME_OSG_PROJECT
            spool: true
            keepalive: true
          defaults:
            request_cpus: 1
            request_memory: 4096 # MB
            request_disk: 1024 # MB
            max_runtime_seconds: 3600
            singularity_image: /cvmfs/singularity.opensciencegrid.org/michaelwcoughlin/fiesta:latest
            use_wrapper: true
            cpu_requirements: "(has_avx == True)"
          poller:
            interval_seconds: 60
          batch:
            enabled: true
            max_size: 50
            window_seconds: 30
          caps:
            max_concurrent_total: 600
            max_concurrent_per_analysis: 600
            max_concurrent_per_resource_per_analysis: 8
          # No OSDF output staging (mirrors the proven NRP setup): condor spool +
          # staging_dir bring the small Fiesta outputs back to the pod.
          osdf:
            output_prefix: null
          staging_dir: /tmp/staging
          auth:
            # Real value provided via the sops-managed config secret at deploy.
            incoming_bearer_token: CHANGEME_SHARED_SECRET

  brokers:
    # Run the native in-core ingestion service (services/broker_ingest), which
    # replaces the retired boom-skyportal-plugin listener. It consumes each
    # active broker's stream (BOOM's kafka config lives on the Broker record's
    # altdata) and ingests alerts via the shared save transform.
    ingest_enabled: True
    # broker_ingest OS processes; extras replicate only Kafka-group providers.
    ingest_processes: 2

  misc:
    minutes_to_keep_candidate_query_cache: 120
    # When a data product (photometry, spectra, ...) is uploaded without specifying
    # any groups, share it with the sitewide public group (public_group_name) in
    # addition to the uploader's single-user group (which is always included). When
    # false (default) an unspecified upload is shared only with the uploader. Groups
    # given explicitly on the upload are always honored as-is.
    share_data_with_public_group_by_default: true

  external_logging:
    sentry:
      # Set traces_sample_rate to 1.0 to capture 100%
      # of transactions for performance monitoring.
      # Sentry recommends adjusting this value in production.
      traces_sample_rate: 1.0

  cron: []
  # - interval: 1440
  #   script: jobs/delete_unsaved_candidates.py
  #   limit: ["01:00", "02:00"]

  analysis_services:
    openai_analysis_service:
      summary:
        temperature: 0.2
        model: gpt-3.5-turbo
        prompt: Using markdown (with appropriate URL links), in one human-readable paragraph please summarize the following comments about this astronomical source. If classification and/or redshift are given, then note those in the summary. This summary will be primarily read by professional astronomers to help them with their work.
      embeddings_store:
        summary:
          location: pgvector
          model: qwen3-embedding
          base_url: https://ellm.nrp-nautilus.io/v1

  gcn:
    notice_types:
      voevent:
        - gcn.classic.voevent.FERMI_GBM_FLT_POS
        - gcn.classic.voevent.FERMI_GBM_GND_POS
        - gcn.classic.voevent.FERMI_GBM_FIN_POS
        - gcn.classic.voevent.FERMI_GBM_SUBTHRESH
        - gcn.classic.voevent.SWIFT_BAT_GRB_POS_ACK
        - gcn.classic.voevent.SWIFT_XRT_POSITION
        # - gcn.classic.voevent.AMON_ICECUBE_COINC
        # - gcn.classic.voevent.AMON_ICECUBE_HESE
        - gcn.classic.voevent.SNEWS
        - gcn.classic.voevent.ICECUBE_ASTROTRACK_GOLD
        - gcn.classic.voevent.ICECUBE_ASTROTRACK_BRONZE
        - gcn.classic.voevent.MAXI_UNKNOWN
        - gcn.notices.svom.voevent.grm
        - gcn.notices.svom.voevent.eclairs
      json:
        - igwn.gwalert
        - einstein_probe.wxt.alert
        - swift.bat.guano
        - icecube.lvk_nu_track_search

  smtp:
    host:
    port:
  # This value needs to be either "sendgrid" or "smtp" (without quotes)
  email_service: sendgrid

  user_applications:
    enabled: True
    email_subject: "A new Fritz account application is awaiting review"
    form_preamble: |
      Tell us who you are and what you would use Fritz for. An administrator
      reviews each application, and you will be emailed an invitation if it is
      approved.

  # define the additional passbands that are not in SNCosmo
  # (https://sncosmo.readthedocs.io/en/stable/bandpass-list.html)
  # the names must be unique. The wavelength array should
  # describe the full extent of the bandpass in Angstrom
  # and the transmission should be a vector of the same
  # length that defines the full Quantum Efficiency at each wavelength.
  # must have at least two elements in the arrays
  # `wavelength` and `transmission`.
  # additional_bandpasses:
  #  - name: 'atlasc'
  #    filterset: 'atlas'
  #    wavelength: [4150, 4157, 6556, 6560]
  #    transmission: [0, 1, 1, 0]
  #    description: "basic ATLAS C filter - tophat transmission"
  #  - name: 'atlaso'
  #    filterset: 'atlas'
  #    wavelength: [5580, 5582, 8249, 8250]
  #    transmission: [0, 1, 1, 0]
  #    description: "basic ATLAS O filter - tophat transmission"

  docs:
    servers:
      - url: https://fritz.science
        description: Production
      - url: https://preview.fritz.science
        description: Preview/Testing

  boom:
    protocol: http
    host: boom-api-1
    port: 4000
    username: admin
    password: adminsecret
    filter_modules:
      # boom-mongo is provisioned with MONGO_INITDB_ROOT_USERNAME/PASSWORD
      # so the URI must authenticate. Production deployments should
      # override these via their own fritz.yaml.
      mongodb_uri: "mongodb://mongoadmin:mongoadminsecret@mongo:27017/?authSource=admin"
      database: "boom_filter_modules"

docs:
  servers:
    - url: https://fritz.science
      description: Production server
    - url: https://preview.fritz.science
      description: Test server
